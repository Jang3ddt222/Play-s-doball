<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premier League Live Player</title>
    <!-- HLS.js สำหรับเล่นไฟล์ .m3u8 บนเบราว์เซอร์ทั่วไป -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
            border-bottom: 2px solid #334155;
            padding-bottom: 15px;
        }
        header img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
        }
        header h1 {
            font-size: 1.8rem;
            margin: 0;
        }
        .player-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 30px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }
        video, iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        .placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-secondary);
            font-size: 1.2rem;
        }
        .group-title {
            font-size: 1.4rem;
            margin-bottom: 15px;
            color: var(--accent-color);
        }
        .stations-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .station-card {
            background-color: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
        }
        .station-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            border-color: var(--accent-color);
        }
        .station-img-container {
            width: 100%;
            height: 140px;
            background-color: #000;
            position: relative;
        }
        .station-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .station-info {
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .station-name {
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 5px;
        }
        .station-badge {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <img id="app-logo" src="" alt="Logo">
        <h1 id="app-name">Premier League Live</h1>
    </header>

    <!-- พื้นที่แสดง Player -->
    <div class="player-container" id="player-box">
        <div class="placeholder">เลือกคู่แข่งขันด้านล่างเพื่อเริ่มรับชม</div>
    </div>

    <!-- รายการกลุ่มและช่องแข่งขัน -->
    <div id="content-area"></div>
</div>

<script>
    // ข้อมูล JSON ของคุณ (รวมลิงก์ Man Utd vs Aston Villa แล้ว)
    const playlistData = {
      "name": "Premier League Live",
      "author": "แถม Premier League",
      "image": "https://dooball66-hd.com/favicon.ico",
      "groups": [
        {
          "name": "08/11/2026 |  Premier League",
          "image": "https://image.api-b-cdn.com/football/leagues/39.png",
          "stations": [
            {
              "name": "Brighton vs Brentford",
              "info": "⚽ Premier League",
              "image": "https://static.ppvservices.st/assets/thumb/32fd8098ffa752c65ed9b01109223e5c-thumbnail.jpg",
              "url": "https://admin2.formaturamaxi.com.br/plus.m3u8",
              "embed": "true",
              "isWeb": true
            },
            {
              "name": "Brighton vs Brentford",
              "info": "⚽ Premier League",
              "image": "https://static.ppvservices.st/assets/thumb/32fd8098ffa752c65ed9b01109223e5c-thumbnail.jpg",
              "url": "https://sportsbite.org/247/skysportsplus",
              "userAgent": "Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Mobile Safari/537.36",
              "isWeb": true
            },
            {
              "name": "Crystal Palace vs Liverpool",
              "info": "⚽ Premier League",
              "image": "https://static.ppvservices.st/assets/thumb/3ae52ce24a78332a298538690a722132-thumbnail.jpg", 
              "url": "https://admin2.formaturamaxi.com.br/main.m3u8",
              "embed": "true"
            },
            {
              "name": "Ipswich Town vs AFC Bournemouth",
              "info": "⚽ Premier League",
              "image": "https://static.ppvservices.st/assets/thumb/30b825b0473a19430fe688e5a886f54b-thumbnail.jpg",
              "url": "https://admin2.formaturamaxi.com.br/ipswich.m3u8",
              "embed": "true",
              "isWeb": true
            },
            {
              "name": "Sunderland vs Chelsea",
              "info": "⚽ Premier League",
              "image": "https://static.ppvservices.st/assets/thumb/64daee3fbb4f243a948cf455cb1a65bb-thumbnail.jpg",
              "url": "https://taifood-blog.asia/embed/pl/2026-11-08/sun-che",
              "embed": "true",
              "isWeb": true
            }, 
            {
              "name": "Sunderland vs Chelsea",
              "info": "⚽ Premier League",
              "image": "https://static.ppvservices.st/assets/thumb/64daee3fbb4f243a948cf455cb1a65bb-thumbnail.jpg",
              "url": "https://admin2.formaturamaxi.com.br/chelsea.m3u8",
              "embed": "true",
              "isWeb": true
            },
            {
              "name": "Manchester United vs Aston Villa",
              "info": "⚽ Premier League",
              "image": "https://static.ppvservices.st/assets/thumb/12b00704a89100d988fd37ef80360c79-thumbnail.jpg",
              "url": "https://admin2.formaturamaxi.com.br/usa.m3u8",
              "embed": "true",
              "userAgent": "Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Mobile Safari/537.36",
              "isWeb": true
            }
          ]
        }
      ]
    };

    // โหลดข้อมูล Header
    document.getElementById('app-name').innerText = playlistData.name;
    document.getElementById('app-logo').src = playlistData.image;

    const contentArea = document.getElementById('content-area');

    // สร้างเนื้อหาตามโครงสร้าง JSON
    playlistData.groups.forEach(group => {
        const groupDiv = document.createElement('div');
        
        const titleEl = document.createElement('h2');
        titleEl.className = 'group-title';
        titleEl.innerText = group.name;
        groupDiv.appendChild(titleEl);

        const gridEl = document.createElement('div');
        gridEl.className = 'stations-grid';

        group.stations.forEach(station => {
            const card = document.createElement('div');
            card.className = 'station-card';
            
            const cleanName = station.name.replace(/^\[/, '');

            card.innerHTML = `
                <div class="station-img-container">
                    <img src="${station.image}" alt="${cleanName}" loading="lazy">
                </div>
                <div class="station-info">
                    <div class="station-name">${cleanName}</div>
                    <div class="station-badge">${station.info}</div>
                </div>
            `;

            card.addEventListener('click', () => {
                playStream(station);
            });

            gridEl.appendChild(card);
        });

        groupDiv.appendChild(gridEl);
        contentArea.appendChild(groupDiv);
    });

    // ฟังก์ชันสำหรับเล่นวิดีโอ
    function playStream(station) {
        const box = document.getElementById('player-box');
        box.innerHTML = '';

        const url = station.url;

        if (url.includes('http') && (station.embed === "true" || url.includes('embed') || url.includes('sportsbite'))) {
            const iframe = document.createElement('iframe');
            iframe.src = url;
            iframe.setAttribute('allowfullscreen', 'true');
            iframe.setAttribute('allow', 'autoplay; encrypted-media');
            box.appendChild(iframe);
        } else if (url.endsWith('.m3u8') || url.includes('.m3u8')) {
            const video = document.createElement('video');
            video.controls = true;
            video.autoplay = true;
            box.appendChild(video);

            if (Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play().catch(e => console.log("Auto-play blocked:", e));
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.addEventListener('loadedmetadata', () => {
                    video.play();
                });
            }
        } else {
            const video = document.createElement('video');
            video.src = url;
            video.controls = true;
            video.autoplay = true;
            box.appendChild(video);
        }
    }
</script>

</body>
</html>
